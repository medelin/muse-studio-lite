# pre-commit install  — the same checks as CI, before every commit.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1  # same version as CI
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: mypy
        name: mypy studio
        entry: .venv/bin/python -m mypy studio
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        types: [python]
