# "Run it yourself" judge sandbox on a clean VPS: Caddy (automatic TLS) + the app.
#   cp deploy/sandbox.env.example sandbox.env   # fill in; chmod 600
#   STUDIO_DOMAIN=studio.example.org docker compose up -d --build
# Details, limits and the reset schedule: docs/SANDBOX.md. Our own sandbox runs the same app
# under systemd instead (deploy/), not from this file.
name: muse-studio-lite

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: sandbox.env
    environment:
      STUDIO_SANDBOX: "1"
      STUDIO_DATA_DIR: /data
      META_ADAPTER: mock
      COOKIE_SECURE: "1"
      TRUSTED_PROXY: 172.30.80.2
    volumes:
      - studio-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      web:
        ipv4_address: 172.30.80.3

  caddy:
    image: caddy:2.10.2
    depends_on:
      app:
        condition: service_healthy
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:?set STUDIO_DOMAIN to the sandbox host name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks:
      web:
        ipv4_address: 172.30.80.2

volumes:
  studio-data:
  caddy-data:
  caddy-config:

networks:
  web:
    ipam:
      config:
        - subnet: 172.30.80.0/24
