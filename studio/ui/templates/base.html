<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Muse Studio Lite{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Muse Studio Lite</a>
    <a href="/studio">Studio</a>
    <a href="/inbox">Inbox</a>
    <span class="tag">every agent leaves a receipt · a human signs every send</span>
    {% if read_only %}<span class="badge warn">read-only</span>{% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="foot">
    Ledger <code>{{ epoch }}</code> · manifest seq <code>{{ seq }}</code> ·
    <a href="/api/receipts.jsonl">receipts.jsonl</a> ·
    <a href="/api/ledger-manifest">manifest</a> ·
    <a href="/api/ledger-key">ledger key</a>
  </footer>
</body>
</html>
